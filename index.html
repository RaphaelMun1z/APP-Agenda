<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef1f5">
  <title>Agenda em Linha do Tempo</title>
  <style>
    :root {
      --page: #eef1f5;
      --surface: #ffffff;
      --surface-soft: #f7f8fa;
      --text: #172033;
      --muted: #667085;
      --line: #c9ced6;
      --line-strong: #98a2b3;
      --accent: #e86f19;
      --accent-hover: #c95d12;
      --danger: #b42318;
      --ebserh: #72b01d;
      --ufu: #143d73;
      --tcc: #6d28d9;
      --other: #64748b;
      --past: #dfe3e8;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .toolbar {
      min-height: 68px;
      padding: 10px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: end;
      gap: 10px;
    }

    .field {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      color: #344054;
      font-size: 0.73rem;
      font-weight: 750;
      letter-spacing: 0.01em;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 37px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #ffffff;
      color: var(--text);
      outline: none;
      box-shadow: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
      outline: 2px solid rgba(232, 111, 25, 0.12);
      outline-offset: -2px;
    }

    .date-field {
      width: 180px;
    }

    .discipline-field {
      width: min(300px, 30vw);
    }

    .clear-button,
    .secondary-button,
    .primary-button,
    .close-button,
    .icon-button,
    .attachment-button,
    .remove-attachment-button,
    .floating-button {
      border-radius: 0;
      box-shadow: none;
    }

    .clear-button,
    .secondary-button {
      min-height: 37px;
      padding: 0 12px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: #344054;
      font-weight: 700;
    }

    .clear-button:hover,
    .secondary-button:hover {
      background: #f2f4f7;
    }

    .primary-button {
      min-height: 39px;
      padding: 0 15px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #ffffff;
      font-weight: 750;
    }

    .primary-button:hover,
    .floating-button:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .toolbar-summary {
      margin-left: auto;
      align-self: center;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: right;
    }

    .timeline-shell {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #f3f5f7;
      display: grid;
      grid-template-rows: 38px minmax(0, 1fr);
    }

    .timeline-strip {
      padding: 0 18px;
      background: #e9edf2;
      color: #475467;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 0.75rem;
    }

    .timeline-strip strong {
      color: #344054;
      font-size: 0.78rem;
    }

    .timeline {
      min-width: 0;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      align-items: stretch;
      gap: 0;
      scroll-behavior: auto;
      overscroll-behavior-inline: contain;
      scrollbar-color: #98a2b3 #e4e7ec;
      scrollbar-width: thin;
      cursor: default;
    }

    .timeline.is-panning,
    .timeline.is-panning * {
      cursor: grabbing !important;
      user-select: none !important;
    }

    .timeline::-webkit-scrollbar {
      height: 11px;
    }

    .timeline::-webkit-scrollbar-track {
      background: #e4e7ec;
    }

    .timeline::-webkit-scrollbar-thumb {
      background: #98a2b3;
      border: 2px solid #e4e7ec;
    }

    .day-column {
      --column-base: #f8f9fb;
      --urgency-opacity: 0;
      flex: 0 0 clamp(270px, 23vw, 340px);
      min-width: 270px;
      height: 100%;
      min-height: 0;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(rgba(217, 45, 32, var(--urgency-opacity)), rgba(217, 45, 32, var(--urgency-opacity))),
        var(--column-base);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      position: relative;
      transition: background-color 120ms ease;
      cursor: grab;
    }

    .day-column:first-child {
      border-left: 1px solid var(--line);
    }

    .day-column:nth-child(even) {
      --column-base: #f2f4f7;
    }

    .day-column.is-past {
      --column-base: var(--past);
      color: #667085;
      filter: saturate(0.45);
    }

    .day-column.is-today {
      --urgency-opacity: 0.18;
    }

    .day-column.drop-target {
      outline: 3px solid var(--accent);
      outline-offset: -3px;
      z-index: 2;
    }

    .day-column.drop-target::after {
      content: "Solte para mover";
      position: absolute;
      inset: 52px 10px auto;
      padding: 8px;
      background: #101828;
      color: #ffffff;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      pointer-events: none;
    }

    .day-heading {
      min-height: 80px;
      padding: 13px 14px 11px;
      background: rgba(255, 255, 255, 0.46);
      backdrop-filter: blur(2px);
    }

    .is-past .day-heading {
      background: rgba(255, 255, 255, 0.24);
    }

    .day-heading-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .day-heading h2 {
      margin: 0;
      font-size: 0.96rem;
      line-height: 1.25;
      text-transform: capitalize;
    }

    .day-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .deadline-badge {
      flex: none;
      min-width: 52px;
      min-height: 38px;
      padding: 5px 7px;
      background: rgba(255, 255, 255, 0.7);
      color: #475467;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 0.66rem;
      font-weight: 850;
      line-height: 1.08;
    }

    .day-column.is-urgent .deadline-badge {
      background: #b42318;
      color: #ffffff;
    }

    .day-column.is-today .deadline-badge {
      background: #912018;
    }

    .day-column.is-past .deadline-badge {
      background: #c7ccd3;
      color: #475467;
    }

    .cards {
      min-height: 0;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      scrollbar-width: thin;
      scrollbar-color: #b6bdc8 transparent;
    }

    .appointment-card {
      position: relative;
      padding: 12px 12px 11px;
      border: 2px solid var(--other);
      border-left-width: 7px;
      border-radius: 0;
      box-shadow: none;
      background: #ffffff;
      color: #172033;
      cursor: grab;
      user-select: none;
      transition: opacity 100ms ease, transform 100ms ease;
    }

    .appointment-card:hover {
      transform: translateY(-1px);
    }

    .appointment-card:active {
      cursor: grabbing;
    }

    .appointment-card.dragging {
      opacity: 0.35;
      transform: none;
    }

    .appointment-card[data-area="EBSERH"] {
      border-color: var(--ebserh);
    }

    .appointment-card[data-area="UFU"] {
      border-color: var(--ufu);
    }

    .appointment-card[data-area="TCC"] {
      border-color: var(--tcc);
    }

    .appointment-card[data-area="OUTROS"] {
      border-color: var(--other);
    }

    .card-category {
      padding-right: 58px;
      color: #1d2939;
      font-size: 0.69rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card-subcategory {
      margin-top: 3px;
      padding-right: 58px;
      color: #475467;
      font-size: 0.76rem;
      font-weight: 750;
      line-height: 1.25;
    }

    .card-time {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #667085;
      font-size: 0.71rem;
      font-weight: 700;
    }

    .card-time .time {
      color: #1d2939;
      font-weight: 850;
    }

    .separator {
      color: #98a2b3;
    }

    .appointment-card h3 {
      margin: 7px 0 0;
      font-size: 0.94rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .card-actions {
      position: absolute;
      top: 7px;
      right: 7px;
      display: flex;
      gap: 3px;
      opacity: 0.55;
    }

    .appointment-card:hover .card-actions,
    .card-actions:focus-within {
      opacity: 1;
    }

    .icon-button {
      width: 25px;
      height: 25px;
      padding: 0;
      border: 1px solid rgba(15, 23, 42, 0.22);
      background: #ffffff;
      color: #475467;
      display: inline-grid;
      place-items: center;
      font-size: 0.78rem;
      font-weight: 850;
    }

    .icon-button:hover {
      background: #f7f8fa;
      color: #101828;
    }

    .icon-button.delete:hover {
      border-color: #f04438;
      color: var(--danger);
    }

    .attachments {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #e4e7ec;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .attachment-button {
      width: 100%;
      padding: 5px 7px;
      border: 1px solid #d0d5dd;
      background: #f8fafc;
      color: #344054;
      display: flex;
      align-items: center;
      gap: 6px;
      text-align: left;
      font-size: 0.7rem;
      line-height: 1.25;
    }

    .attachment-button:hover {
      border-color: #98a2b3;
      background: #ffffff;
    }

    .attachment-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-state {
      flex: 1 0 100%;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 30px;
      background: #f7f8fa;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 5px;
      color: #344054;
    }

    .floating-button {
      position: fixed;
      right: 22px;
      bottom: 24px;
      z-index: 20;
      min-height: 48px;
      padding: 0 17px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #ffffff;
      font-weight: 800;
    }

    dialog {
      width: min(520px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 0;
      box-shadow: none;
      background: #ffffff;
      color: var(--text);
      overflow: hidden;
    }

    dialog::backdrop {
      background: rgba(15, 23, 42, 0.62);
    }

    .modal-header {
      min-height: 55px;
      padding: 11px 14px 11px 17px;
      background: #f7f8fa;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.02rem;
    }

    .close-button {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      background: #ffffff;
      color: #475467;
      font-size: 1.1rem;
    }

    .appointment-form {
      max-height: calc(100vh - 80px);
      padding: 16px 17px 17px;
      overflow-y: auto;
      display: grid;
      gap: 12px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 145px;
      gap: 11px;
    }

    .file-input {
      padding: 7px !important;
      height: auto;
    }

    .attachment-editor {
      display: grid;
      gap: 6px;
    }

    .attachment-editor:empty {
      display: none;
    }

    .attachment-editor-item {
      min-height: 34px;
      padding: 5px 6px 5px 9px;
      border: 1px solid #d0d5dd;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      color: #344054;
      font-size: 0.72rem;
    }

    .attachment-editor-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-attachment-button {
      flex: none;
      width: 25px;
      height: 25px;
      padding: 0;
      border: 1px solid #d0d5dd;
      background: #ffffff;
      color: var(--danger);
      font-weight: 850;
    }

    .file-help {
      color: #667085;
      font-size: 0.68rem;
      line-height: 1.35;
    }

    .modal-actions {
      margin-top: 4px;
      padding-top: 13px;
      border-top: 1px solid #e4e7ec;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    @media (max-width: 760px) {
      .toolbar {
        min-height: 108px;
        padding: 8px 10px;
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        align-items: end;
      }

      .date-field,
      .discipline-field {
        width: auto;
      }

      .toolbar-summary {
        grid-column: 1 / -1;
        margin-left: 0;
        text-align: left;
      }

      .timeline-strip {
        padding: 0 10px;
      }

      .timeline-strip span {
        display: none;
      }

      .day-column {
        flex-basis: min(86vw, 320px);
        min-width: min(86vw, 320px);
      }

      .floating-button {
        right: 12px;
        bottom: 18px;
      }
    }

    @media (max-width: 520px) {
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .clear-button {
        grid-column: 1 / -1;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .card-actions {
        opacity: 1;
      }

      .floating-button {
        min-height: 44px;
        padding: 0 13px;
        font-size: 0.82rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  
    /* Ajustes da versão 4 */
    .category-field {
      width: min(190px, 20vw);
    }

    .subcategory-filter-field {
      width: min(270px, 27vw);
    }

    .floating-button {
      width: 50px;
      height: 50px;
      min-height: 0;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 1.8rem;
      font-weight: 500;
      line-height: 1;
    }

    .form-row {
      grid-template-columns: 1fr 125px 125px;
    }

    .appointment-card {
      --category-color: var(--other);
      border-color: var(--category-color);
      background: #ffffff;
    }

    .appointment-card[data-area="EBSERH"] {
      --category-color: var(--ebserh);
    }

    .appointment-card[data-area="UFU"] {
      --category-color: var(--ufu);
    }

    .appointment-card[data-area="TCC"] {
      --category-color: var(--tcc);
    }

    .appointment-card[data-area="OUTROS"] {
      --category-color: var(--other);
    }

    .card-category,
    .card-subcategory {
      margin-left: -12px;
      margin-right: -12px;
      padding-left: 11px;
      padding-right: 70px;
      background: var(--category-color);
      color: #ffffff;
    }

    .card-category {
      margin-top: -12px;
      padding-top: 9px;
      padding-bottom: 4px;
    }

    .card-subcategory {
      margin-top: 0;
      padding-top: 3px;
      padding-bottom: 9px;
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      color: #ffffff;
    }

    .card-time {
      margin-top: 11px;
      padding: 8px 9px;
      border: 1px solid #cfd5dd;
      background: #f4f6f8;
      color: #1d2939;
      gap: 6px;
      font-size: 0.76rem;
      font-weight: 850;
    }

    .card-time-label {
      color: #667085;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .card-time-separator {
      color: #98a2b3;
      font-weight: 700;
    }

    .day-column.is-past .appointment-card {
      --category-color: #858e9a;
      border-color: #858e9a;
      background: #cfd4da;
      color: #5f6874;
    }

    .day-column.is-past .card-time {
      border-color: #aeb5be;
      background: #bcc3cb;
      color: #5b6470;
    }

    .day-column.is-past .card-time-label,
    .day-column.is-past .card-time-separator {
      color: #69727e;
    }

    .day-column.is-past .attachments {
      border-top-color: #aeb5be;
    }

    .day-column.is-past .attachment-button {
      border-color: #aeb5be;
      background: #c5cbd2;
      color: #5f6874;
    }

    @media (max-width: 760px) {
      .toolbar {
        min-height: 150px;
        grid-template-columns: 1fr 1fr;
      }

      .date-field,
      .category-field,
      .subcategory-filter-field {
        width: auto;
      }

      .clear-button,
      .toolbar-summary {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 520px) {
      .floating-button {
        width: 44px;
        height: 44px;
        font-size: 1.6rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }

  
    /* Ajustes da versão 5 */
    .timeline-shell {
      grid-template-rows: minmax(0, 1fr);
    }

    .score-badge {
      margin-top: 9px;
      padding: 6px 8px;
      border: 1px solid var(--category-color);
      background: #f8fafc;
      color: #1d2939;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .score-badge strong {
      color: var(--category-color);
      font-size: 0.82rem;
    }

    .day-column.is-past .score-badge {
      border-color: #858e9a;
      background: #bcc3cb;
      color: #5f6874;
    }

    .day-column.is-past .score-badge strong {
      color: #5f6874;
    }

    [hidden] {
      display: none !important;
    }

  
    .cards {
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }

    .day-column {
      overscroll-behavior-y: contain;
    }

  
    .file-actions {
      display: flex;
      align-items: end;
      gap: 7px;
    }

    .file-action-button {
      min-height: 37px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #ffffff;
      color: #344054;
      font-weight: 750;
      box-shadow: none;
      white-space: nowrap;
    }

    .file-action-button:hover {
      background: #f2f4f7;
    }

    .file-action-button.save {
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .file-state {
      align-self: center;
      max-width: 210px;
      color: #667085;
      font-size: 0.7rem;
      line-height: 1.3;
    }

    .file-state.unsaved {
      color: #b54708;
      font-weight: 750;
    }

    @media (max-width: 980px) {
      .file-actions {
        grid-column: 1 / -1;
      }

      .file-state {
        max-width: none;
      }
    }

    @media (max-width: 520px) {
      .file-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .file-action-button {
        width: 100%;
      }

      .file-state {
        grid-column: 1 / -1;
      }
    }

  
    .status-button {
      width: 25px;
      height: 25px;
      padding: 0;
      border: 1px solid rgba(15, 23, 42, 0.22);
      border-radius: 0;
      background: #ffffff;
      color: #475467;
      display: inline-grid;
      place-items: center;
      font-size: 0.78rem;
      font-weight: 900;
      box-shadow: none;
    }

    .status-button:hover {
      background: #f7f8fa;
      color: #101828;
    }

    .appointment-card.is-completed {
      --category-color: #858e9a;
      border-color: #858e9a;
      background: #d0d5dc;
      color: #596270;
    }

    .appointment-card.is-completed .card-time,
    .appointment-card.is-completed .score-badge {
      border-color: #aeb5be;
      background: #bcc3cb;
      color: #5b6470;
    }

    .appointment-card.is-completed .card-time-label,

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error("Falha ao ler o arquivo."));
        reader.readAsDataURL(file);
      });
    }

    async function serializeAttachmentFile(file) {
      return {
        id: crypto.randomUUID(),
        name: file.name,
        type: file.type || "application/octet-stream",
        size: file.size,
        dataUrl: await readFileAsDataURL(file)
      };
    }

    function localISODate(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function addDays(baseDate, amount) {
      const date = new Date(baseDate);
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() + amount);
      return localISODate(date);
    }

    function normalizeAppointment(item) {
      const area = ["EBSERH", "UFU", "TCC", "OUTROS"].includes(item.area)
        ? item.area
        : "OUTROS";

      const allowedSubcategories = subcategories[area] || subcategories.OUTROS;
      const subcategory = allowedSubcategories.some(option => option.value === item.subcategory)
        ? item.subcategory
        : allowedSubcategories[0].value;

      return {
        id: String(item.id || crypto.randomUUID()),
        title: String(item.title || "Compromisso sem título"),
        date: String(item.date || localISODate()),
        startTime: String(item.startTime ?? item.time ?? ""),
        endTime: String(item.endTime ?? ""),
        area,
        subcategory,
        score: area === "UFU" ? (item.score ?? "") : "",
        status: item.status === "done" ? "done" : "pending",
        attachments: Array.isArray(item.attachments)
          ? item.attachments
              .filter(attachment => attachment && attachment.id && attachment.name)
              .map(attachment => ({
                id: String(attachment.id),
                name: String(attachment.name),
                type: String(attachment.type || "application/octet-stream"),
                size: Number(attachment.size || 0),
                dataUrl: typeof attachment.dataUrl === "string" ? attachment.dataUrl : ""
              }))
          : []
      };
    }

    function loadAppointments() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
          loadedFromLocalStorage = true;
          return parseAgendaPayload(JSON.parse(saved));
        }
      } catch (error) {
        console.warn("Não foi possível carregar os dados salvos no navegador.", error);
      }

      return createInitialAppointments().map(normalizeAppointment);
    }

    function setAutoSaveState(state, text) {
      autoSaveState.className = `auto-save-state ${state ? `is-${state}` : ""}`.trim();
      autoSaveState.textContent = text;
    }

    function createAgendaPayload() {
      return {
        format: "agenda-linha-do-tempo",
        version: 1,
        updatedAt: new Date().toISOString(),
        appointments
      };
    }

    function parseAgendaPayload(data) {
      const source = Array.isArray(data)
        ? data
        : Array.isArray(data.appointments)
          ? data.appointments
          : Array.isArray(data.events)
            ? data.events
            : null;

      if (!source) {
        throw new Error("O arquivo não contém uma lista válida de compromissos.");
      }

      return source.map(normalizeAppointment);
    }

    function saveAppointments() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(createAgendaPayload()));
        setAutoSaveState("saved", "Salvo no navegador");
        return true;
      } catch (error) {
        console.error("Não foi possível salvar os dados no navegador.", error);
        setAutoSaveState("error", "Erro ao salvar no navegador");
        window.alert(
          "Não foi possível salvar os dados no navegador. O espaço disponível pode ter sido excedido pelos anexos. Exporte um backup JSON antes de fechar."
        );
        return false;
      }
    }

    function exportBackup() {
      const content = JSON.stringify(createAgendaPayload(), null, 2);
      const blob = new Blob([content], {
        type: "application/json;charset=utf-8"
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = `agenda-${localISODate()}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function importBackup(file) {
      const importedAppointments = parseAgendaPayload(
        JSON.parse(await file.text())
      );

      const confirmed = window.confirm(
        `Importar ${importedAppointments.length} compromissos? Os dados atuais deste navegador serão substituídos.`
      );

      if (!confirmed) return;

      appointments = importedAppointments;
      loadedFromLocalStorage = true;

      if (!saveAppointments()) return;

      dateFilter.value = "";
      categoryFilter.value = "";
      subcategoryFilter.value = "";
      shouldPositionTimeline = true;
      updateSubcategoryFilter();
      renderTimeline();
      window.alert("Backup importado com sucesso.");
    }

    function initializeAgenda() {
      updateSubcategoryFilter();
      renderTimeline();

      if (loadedFromLocalStorage) {
        setAutoSaveState("saved", "Salvo no navegador");
      } else {
        saveAppointments();
      }
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function getSubcategory(area, value) {
      return (subcategories[area] || subcategories.OUTROS).find(item => item.value === value) || subcategories.OUTROS[0];
    }

    function daysFromToday(dateString) {
      const today = new Date(`${localISODate()}T12:00:00`);
      const date = new Date(`${dateString}T12:00:00`);
      return Math.round((date - today) / 86400000);
    }

    function formatLongDate(dateString) {
      const date = new Date(`${dateString}T12:00:00`);
      return new Intl.DateTimeFormat("pt-BR", {
        weekday: "long",
        day: "2-digit",
        month: "long"
      }).format(date);
    }

    function formatShortDate(dateString) {
      const date = new Date(`${dateString}T12:00:00`);
      return new Intl.DateTimeFormat("pt-BR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }).format(date);
    }

    function relativeDateLabel(dateString) {
      const difference = daysFromToday(dateString);
      if (difference === 0) return "Hoje";
      if (difference === 1) return "Amanhã";
      if (difference === -1) return "Ontem";
      if (difference > 1) return `Em ${difference} dias`;
      return `Há ${Math.abs(difference)} dias`;
    }

    function deadlineBadgeText(dateString) {
      const difference = daysFromToday(dateString);
      if (difference === 0) return "HOJE";
      if (difference === 1) return "1 DIA";
      if (difference > 1) return `${difference} DIAS`;
      if (difference === -1) return "ONTEM";
      return `${Math.abs(difference)} DIAS ATRÁS`;
    }

    function urgencyOpacity(days) {
      if (days < 0 || days > 7) return 0;
      return (0.055 + (7 - days) * 0.0175).toFixed(3);
    }

    function updateSubcategoryFilter() {
      const selectedValue = subcategoryFilter.value;
      const selectedCategory = categoryFilter.value;
      const availableItems = selectedCategory
        ? (subcategories[selectedCategory] || [])
        : Object.values(subcategories).flat();

      const uniqueItems = [...new Map(
        availableItems.map(item => [item.value, item])
      ).values()];

      subcategoryFilter.innerHTML = '<option value="">Todas as subcategorias</option>';

      uniqueItems.forEach(item => {
        const option = document.createElement("option");
        option.value = item.value;
        option.textContent = item.label;
        subcategoryFilter.appendChild(option);
      });

      subcategoryFilter.value = uniqueItems.some(item => item.value === selectedValue)
        ? selectedValue
        : "";
    }

    function getFilteredAppointments() {
      return appointments.filter(item => {
        const matchesDate = !dateFilter.value || item.date === dateFilter.value;
        const matchesCategory = !categoryFilter.value || item.area === categoryFilter.value;
        const matchesSubcategory = !subcategoryFilter.value || item.subcategory === subcategoryFilter.value;
        return matchesDate && matchesCategory && matchesSubcategory;
      });
    }

    function formatTimeRange(item) {
      const start = item.startTime || item.time || "";
      const end = item.endTime || "";

      if (start && end) {
        return `
          <span class="card-time-label">Horário</span>
          <span>Das ${escapeHTML(start)}</span>
          <span class="card-time-separator">até</span>
          <span>${escapeHTML(end)}</span>
        `;
      }

      if (start) {
        return `
          <span class="card-time-label">Horário</span>
          <span>A partir das ${escapeHTML(start)}</span>
        `;
      }

      if (end) {
        return `
          <span class="card-time-label">Horário</span>
          <span>Até ${escapeHTML(end)}</span>
        `;
      }

      return `
        <span class="card-time-label">Horário</span>
        <span>Não definido</span>
      `;
    }

    function renderAttachmentButtons(item) {
      if (!item.attachments.length) return "";

      return `
        <div class="attachments">
          ${item.attachments.map(attachment => `
            <button
              class="attachment-button"
              type="button"
              draggable="false"
              data-action="open-attachment"
              data-attachment-id="${escapeHTML(attachment.id)}"
              title="${escapeHTML(attachment.name)}"
            >
              <span>📎</span>
              <span class="attachment-name">${escapeHTML(attachment.name)}</span>
            </button>
          `).join("")}
        </div>
      `;
    }

    function renderTimeline(options = {}) {
      const preserveScroll = Boolean(options.preserveScroll);
      const scrollBeforeRender = timeline.scrollLeft;
      const focusDate = options.focusDate || null;

      const filtered = getFilteredAppointments().sort((a, b) => {
        const byDate = a.date.localeCompare(b.date);
        if (byDate !== 0) return byDate;
        return (a.startTime || a.time || "23:59").localeCompare(b.startTime || b.time || "23:59");
      });

      const grouped = filtered.reduce((groups, item) => {
        if (!groups[item.date]) groups[item.date] = [];
        groups[item.date].push(item);
        return groups;
      }, {});

      const dates = Object.keys(grouped).sort();
      timeline.innerHTML = "";

      const completedCount = filtered.filter(item => item.status === "done").length;
      const remainingCount = filtered.length - completedCount;
      const completedText = completedCount === 1 ? "1 realizado" : `${completedCount} realizados`;
      const remainingText = remainingCount === 1 ? "1 restante" : `${remainingCount} restantes`;
      timelineSummary.textContent = `${completedText} · ${remainingText}`;

      if (!dates.length) {
        timeline.innerHTML = `
          <div class="empty-state">
            <div>
              <strong>Nenhum compromisso encontrado</strong>
              Ajuste os filtros ou adicione um novo compromisso.
            </div>
          </div>
        `;
        return;
      }

      dates.forEach(date => {
        const difference = daysFromToday(date);
        const column = document.createElement("article");
        column.className = "day-column";
        column.dataset.date = date;
        column.style.setProperty("--urgency-opacity", urgencyOpacity(difference));

        if (difference < 0) column.classList.add("is-past");
        if (difference === 0) column.classList.add("is-today");
        if (difference >= 0 && difference <= 7) column.classList.add("is-urgent");

        const dayAppointments = grouped[date];
        const cards = dayAppointments.map(item => {
          const subcategory = getSubcategory(item.area, item.subcategory);
          const areaLabel = item.area === "OUTROS" ? "Outros" : item.area;

          return `
            <article
              class="appointment-card ${item.status === "done" ? "is-completed" : ""}"
              data-area="${escapeHTML(item.area)}"
              data-id="${escapeHTML(item.id)}"
              draggable="true"
              title="Arraste para alterar a data"
            >
              <div class="card-actions">
                <button
                  class="status-button"
                  type="button"
                  draggable="false"
                  data-action="toggle-status"
                  data-id="${escapeHTML(item.id)}"
                  aria-label="${item.status === "done" ? "Marcar como pendente" : "Marcar como concluído"}"
                  title="${item.status === "done" ? "Marcar como pendente" : "Marcar como concluído"}"
                >${item.status === "done" ? "✓" : "○"}</button>
                <button class="icon-button" type="button" draggable="false" data-action="edit" data-id="${escapeHTML(item.id)}" aria-label="Editar compromisso">✎</button>
                <button class="icon-button delete" type="button" draggable="false" data-action="delete" data-id="${escapeHTML(item.id)}" aria-label="Excluir compromisso">×</button>
              </div>

              <div class="card-category">${escapeHTML(areaLabel)}</div>
              <div class="card-subcategory">${escapeHTML(subcategory.label)}</div>

              <div class="card-time">
                ${formatTimeRange(item)}
              </div>

              <h3>${escapeHTML(item.title)}</h3>
              ${item.area === "UFU" && item.score !== "" && item.score !== null && item.score !== undefined ? `
                <div class="score-badge">
                  <span>Pontuação</span>
                  <strong>${escapeHTML(item.score)}</strong>
                </div>
              ` : ""}
              ${renderAttachmentButtons(item)}
            </article>
          `;
        }).join("");

        column.innerHTML = `
          <header class="day-heading">
            <div class="day-heading-row">
              <div>
                <h2>${escapeHTML(formatLongDate(date))}</h2>
                <p>${escapeHTML(formatShortDate(date))} · ${dayAppointments.length} ${dayAppointments.length === 1 ? "compromisso" : "compromissos"}</p>
              </div>
              <span class="deadline-badge">${escapeHTML(deadlineBadgeText(date))}</span>
            </div>
          </header>
          <div class="cards">${cards}</div>
        `;

        timeline.appendChild(column);
      });

      requestAnimationFrame(() => {
        if (focusDate) {
          const target = timeline.querySelector(`.day-column[data-date="${CSS.escape(focusDate)}"]`);
          if (target) {
            timeline.scrollLeft = target.offsetLeft;
            return;
          }
        }

        if (preserveScroll) {
          timeline.scrollLeft = scrollBeforeRender;
          return;
        }

        if (shouldPositionTimeline) {
          positionTimelineAtCurrentDate();
          shouldPositionTimeline = false;
        }
      });
    }

    function positionTimelineAtCurrentDate() {
      const columns = [...timeline.querySelectorAll(".day-column")];
      if (!columns.length) return;

      const today = localISODate();
      const target = columns.find(column => column.dataset.date >= today) || columns[columns.length - 1];
      timeline.scrollLeft = target.offsetLeft;
    }

    function updateScoreField() {
      const isUFU = appointmentArea.value === "UFU";
      appointmentScoreField.hidden = !isUFU;
      appointmentScore.disabled = !isUFU;

      if (!isUFU) {
        appointmentScore.value = "";
      }
    }

    function populateSubcategories(selectedValue = "") {
      const area = appointmentArea.value;
      const options = subcategories[area] || subcategories.OUTROS;
      appointmentSubcategory.innerHTML = "";

      options.forEach(item => {
        const option = document.createElement("option");
        option.value = item.value;
        option.textContent = item.label;
        appointmentSubcategory.appendChild(option);
      });

      if (selectedValue && options.some(item => item.value === selectedValue)) {
        appointmentSubcategory.value = selectedValue;
      }

      updateScoreField();
    }

    function renderExistingAttachments(item) {
      existingAttachments.innerHTML = "";

      item.attachments
        .filter(attachment => !attachmentsMarkedForRemoval.has(attachment.id))
        .forEach(attachment => {
          const row = document.createElement("div");
          row.className = "attachment-editor-item";
          row.innerHTML = `
            <span class="attachment-editor-name">📎 ${escapeHTML(attachment.name)} · ${escapeHTML(formatFileSize(attachment.size))}</span>
            <button class="remove-attachment-button" type="button" data-remove-existing="${escapeHTML(attachment.id)}" aria-label="Remover anexo">×</button>
          `;
          existingAttachments.appendChild(row);
        });
    }

    function renderPendingAttachments() {
      pendingAttachments.innerHTML = "";

      pendingFiles.forEach((file, index) => {
        const row = document.createElement("div");
        row.className = "attachment-editor-item";
        row.innerHTML = `
          <span class="attachment-editor-name">Novo: ${escapeHTML(file.name)} · ${escapeHTML(formatFileSize(file.size))}</span>
          <button class="remove-attachment-button" type="button" data-remove-pending="${index}" aria-label="Remover arquivo selecionado">×</button>
        `;
        pendingAttachments.appendChild(row);
      });
    }

    function resetAttachmentEditor() {
      pendingFiles = [];
      attachmentsMarkedForRemoval = new Set();
      appointmentFiles.value = "";
      existingAttachments.innerHTML = "";
      pendingAttachments.innerHTML = "";
    }

    function openNewAppointment() {
      appointmentForm.reset();
      resetAttachmentEditor();
      appointmentId.value = "";
      appointmentDate.value = localISODate();
      appointmentArea.value = "EBSERH";
      appointmentScore.value = "";
      populateSubcategories();
      dialogTitle.textContent = "Novo compromisso";
      appointmentDialog.showModal();
      requestAnimationFrame(() => appointmentTitle.focus());
    }

    function openEditAppointment(id) {
      const item = appointments.find(appointment => appointment.id === id);
      if (!item) return;

      resetAttachmentEditor();
      appointmentId.value = item.id;
      appointmentTitle.value = item.title;
      appointmentDate.value = item.date;
      appointmentStartTime.value = item.startTime || item.time || "";
      appointmentEndTime.value = item.endTime || "";
      appointmentArea.value = item.area;
      appointmentScore.value = item.area === "UFU" ? (item.score ?? "") : "";
      populateSubcategories(item.subcategory);
      renderExistingAttachments(item);
      dialogTitle.textContent = "Editar compromisso";
      appointmentDialog.showModal();
      requestAnimationFrame(() => appointmentTitle.focus());
    }

    function deleteAppointment(id) {
      const item = appointments.find(appointment => appointment.id === id);
      if (!item) return;

      const confirmed = window.confirm(`Excluir o compromisso "${item.title}"?`);
      if (!confirmed) return;

      appointments = appointments.filter(appointment => appointment.id !== id);
      saveAppointments();
      updateSubcategoryFilter();
      renderTimeline({ preserveScroll: true });
    }

    function moveAppointment(id, targetDate) {
      const item = appointments.find(appointment => appointment.id === id);
      if (!item || item.date === targetDate) return false;

      const originalDate = item.date;
      const confirmed = window.confirm(
        `Mover "${item.title}" de ${formatShortDate(originalDate)} para ${formatShortDate(targetDate)}?`
      );

      if (!confirmed) {
        renderTimeline({ focusDate: originalDate });
        return false;
      }

      item.date = targetDate;
      saveAppointments();
      updateSubcategoryFilter();
      renderTimeline({ focusDate: targetDate });
      return true;
    }

    function toggleAppointmentStatus(id) {
      const item = appointments.find(appointment => appointment.id === id);
      if (!item) return;

      item.status = item.status === "done" ? "pending" : "done";
      saveAppointments();
      renderTimeline({ preserveScroll: true });
    }

    function openAttachment(id) {
      const attachment = appointments
        .flatMap(item => item.attachments || [])
        .find(item => item.id === id);

      if (!attachment?.dataUrl) {
        window.alert("O conteúdo deste anexo não está disponível no arquivo da agenda.");
        return;
      }

      const link = document.createElement("a");
      link.href = attachment.dataUrl;
      link.download = attachment.name;
      link.target = "_blank";
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function clearDropTargets() {
      timeline.querySelectorAll(".drop-target").forEach(column => column.classList.remove("drop-target"));
    }

    function closeDialog() {
      appointmentDialog.close();
    }

    exportBackupButton.addEventListener("click", exportBackup);

    importBackupButton.addEventListener("click", () => {
      importBackupInput.click();
    });

    importBackupInput.addEventListener("change", async () => {
      const [file] = importBackupInput.files;
      importBackupInput.value = "";
      if (!file) return;

      try {
        await importBackup(file);
      } catch (error) {
        console.error(error);
        window.alert("O arquivo selecionado não é um backup válido da agenda.");
      }
    });

    newAppointmentButton.addEventListener("click", openNewAppointment);
    closeDialogButton.addEventListener("click", closeDialog);
    cancelDialogButton.addEventListener("click", closeDialog);
    appointmentArea.addEventListener("change", () => {
      populateSubcategories();
      updateScoreField();
    });

    appointmentFiles.addEventListener("change", () => {
      pendingFiles.push(...Array.from(appointmentFiles.files));
      appointmentFiles.value = "";
      renderPendingAttachments();
    });

    existingAttachments.addEventListener("click", event => {
      const button = event.target.closest("[data-remove-existing]");
      if (!button) return;

      attachmentsMarkedForRemoval.add(button.dataset.removeExisting);
      const item = appointments.find(appointment => appointment.id === appointmentId.value);
      if (item) renderExistingAttachments(item);
    });

    pendingAttachments.addEventListener("click", event => {
      const button = event.target.closest("[data-remove-pending]");
      if (!button) return;

      pendingFiles.splice(Number(button.dataset.removePending), 1);
      renderPendingAttachments();
    });

    appointmentForm.addEventListener("submit", async event => {
      event.preventDefault();
      saveAppointmentButton.disabled = true;
      saveAppointmentButton.textContent = "Salvando...";

      const id = appointmentId.value || crypto.randomUUID();
      const existingIndex = appointments.findIndex(item => item.id === id);
      const existingItem = existingIndex >= 0 ? appointments[existingIndex] : null;

      try {
        const keptAttachments = (existingItem?.attachments || []).filter(
          attachment => !attachmentsMarkedForRemoval.has(attachment.id)
        );

        const newAttachments = [];
        for (const file of pendingFiles) {
          newAttachments.push(await serializeAttachmentFile(file));
        }

        const data = {
          id,
          title: appointmentTitle.value.trim(),
          date: appointmentDate.value,
          startTime: appointmentStartTime.value,
          endTime: appointmentEndTime.value,
          area: appointmentArea.value,
          subcategory: appointmentSubcategory.value,
          score: appointmentArea.value === "UFU" ? appointmentScore.value : "",
          status: existingItem?.status || "pending",
          attachments: [...keptAttachments, ...newAttachments]
        };

        if (!data.title || !data.date) return;

        if (existingIndex >= 0) appointments[existingIndex] = data;
        else appointments.push(data);

        saveAppointments();
        updateSubcategoryFilter();
        shouldPositionTimeline = false;
        renderTimeline({ focusDate: data.date });
        closeDialog();
      } catch (error) {
        console.error(error);
        window.alert("Não foi possível preparar o compromisso ou seus anexos.");
      } finally {
        saveAppointmentButton.disabled = false;
        saveAppointmentButton.textContent = "Salvar";
      }
    });

    timeline.addEventListener("click", event => {
      if (panMoved) {
        panMoved = false;
        return;
      }

      const button = event.target.closest("[data-action]");
      if (!button) return;

      const { action, id, attachmentId } = button.dataset;
      if (action === "toggle-status") toggleAppointmentStatus(id);
      if (action === "edit") openEditAppointment(id);
      if (action === "delete") deleteAppointment(id);
      if (action === "open-attachment") openAttachment(attachmentId);
    });

    timeline.addEventListener("dragstart", event => {
      if (event.target.closest("button, a")) {
        event.preventDefault();
        return;
      }

      const card = event.target.closest(".appointment-card");
      if (!card) return;

      draggedAppointmentId = card.dataset.id;
      card.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", draggedAppointmentId);
    });

    timeline.addEventListener("dragover", event => {
      const column = event.target.closest(".day-column");
      if (!column || !draggedAppointmentId) return;

      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      clearDropTargets();
      column.classList.add("drop-target");

      const rect = timeline.getBoundingClientRect();
      const edgeSize = 70;

      if (event.clientX < rect.left + edgeSize) {
        timeline.scrollLeft -= 18;
      } else if (event.clientX > rect.right - edgeSize) {
        timeline.scrollLeft += 18;
      }
    });

    timeline.addEventListener("dragleave", event => {
      const column = event.target.closest(".day-column");
      if (!column) return;

      const related = event.relatedTarget;
      if (!related || !column.contains(related)) {
        column.classList.remove("drop-target");
      }
    });

    timeline.addEventListener("drop", event => {
      const column = event.target.closest(".day-column");
      if (!column) return;

      event.preventDefault();
      const id = event.dataTransfer.getData("text/plain") || draggedAppointmentId;
      const targetDate = column.dataset.date;

      clearDropTargets();
      moveAppointment(id, targetDate);
      draggedAppointmentId = null;
    });

    timeline.addEventListener("dragend", event => {
      const card = event.target.closest(".appointment-card");
      if (card) card.classList.remove("dragging");
      clearDropTargets();
      draggedAppointmentId = null;
    });

    timeline.addEventListener("pointerdown", event => {
      const column = event.target.closest(".day-column");
      if (!column) return;
      if (event.target.closest(".appointment-card, button, input, select, a")) return;
      if (event.button !== 0) return;

      panning = true;
      panMoved = false;
      activePanPointerId = event.pointerId;
      panStartX = event.clientX;
      panStartScrollLeft = timeline.scrollLeft;
      timeline.classList.add("is-panning");
      timeline.setPointerCapture(event.pointerId);
    });

    timeline.addEventListener("pointermove", event => {
      if (!panning || event.pointerId !== activePanPointerId) return;

      const distance = event.clientX - panStartX;
      if (Math.abs(distance) > 4) panMoved = true;
      timeline.scrollLeft = panStartScrollLeft - distance;
    });

    function finishPanning(event) {
      if (!panning || event.pointerId !== activePanPointerId) return;

      panning = false;
      activePanPointerId = null;
      timeline.classList.remove("is-panning");

      if (timeline.hasPointerCapture(event.pointerId)) {
        timeline.releasePointerCapture(event.pointerId);
      }

      window.setTimeout(() => {
        panMoved = false;
      }, 0);
    }

    timeline.addEventListener("pointerup", finishPanning);
    timeline.addEventListener("pointercancel", finishPanning);

    dateFilter.addEventListener("change", () => {
      shouldPositionTimeline = true;
      renderTimeline();
    });

    categoryFilter.addEventListener("change", () => {
      updateSubcategoryFilter();
      shouldPositionTimeline = true;
      renderTimeline();
    });

    subcategoryFilter.addEventListener("change", () => {
      shouldPositionTimeline = true;
      renderTimeline();
    });

    clearFiltersButton.addEventListener("click", () => {
      dateFilter.value = "";
      categoryFilter.value = "";
      subcategoryFilter.value = "";
      updateSubcategoryFilter();
      shouldPositionTimeline = true;
      renderTimeline();
    });

    timeline.addEventListener("wheel", event => {
      const cardsContainer = event.target.closest(".cards");
      const isVerticalScroll = Math.abs(event.deltaY) >= Math.abs(event.deltaX);

      if (cardsContainer && isVerticalScroll && !event.shiftKey) {
        return;
      }

      if (Math.abs(event.deltaX) > 0 || event.shiftKey) {
        event.preventDefault();
      }
    }, { passive: false });

    appointmentDialog.addEventListener("click", event => {
      if (event.target === appointmentDialog) closeDialog();
    });

    initializeAgenda();
  </script>
</body>
</html>
